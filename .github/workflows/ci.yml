name: CI

# Builds the C# project and runs the headless tests on every pull request and every push to main.
# Docs-only changes skip it.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}
      - name: Download Godot .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL --retry 4 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot && unzip -q godot.zip -d ~/godot
      - name: Put Godot on the path
        run: |
          dir="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          ln -sf "$dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Build
        run: dotnet build -warnaserror
      - name: Import
        run: timeout 300 godot --headless --import
      - name: Tests
        run: timeout 300 godot --headless res://tests/TestRunner.tscn
      - name: Results
        if: always()
        run: cat tests/results.txt || true
